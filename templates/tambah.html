
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tambah Proyek | Humairoh</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <h2 class="logo">AdminPanel.</h2>

        <ul>
            <li><a href="/admin">Dashboard</a></li>
            <li><a href="/">Lihat Website</a></li>
            <li><a href="/logout">Logout</a></li>
        </ul>

    </nav>


    <!-- FORM TAMBAH PROYEK -->
    <main class="project-form-page">

        <div class="project-form-box">

            <p class="greeting">PORTFOLIO ADMIN</p>

            <h1>Tambah <span>Proyek</span></h1>

            <p class="form-intro">
                Masukkan tugas kuliah atau proyek yang ingin
                ditampilkan pada halaman My Projects.
            </p>


            <form action="{{ url_for('tambah') }}" method="POST">

                <div class="project-input-group">

                    <label for="nama">Nama Tugas / Proyek</label>

                    <input
                        type="text"
                        id="nama"
                        name="nama"
                        placeholder="Contoh: Website Portfolio"
                        required
                    >

                </div>


                <div class="project-input-group">

                    <label for="deskripsi">Deskripsi Proyek</label>

                    <textarea
                        id="deskripsi"
                        name="deskripsi"
                        rows="5"
                        placeholder="Jelaskan tugas atau proyek yang sudah kamu buat..."
                        required
                    ></textarea>

                </div>


                <!-- Input Teknologi -->
                <div class="project-input-group">
                    <label for="teknologi">Teknologi yang Digunakan</label>
                    <input
                        type="text"
                        id="teknologi"
                        name="teknologi"
                        placeholder="Contoh: Python, Flask, HTML, CSS"
                        required
                    >
                </div>

                <!-- Input Link Proyek -->
                <div class="project-input-group">
                    <label for="link_proyek">Link Proyek</label>
                    <input
                        type="url"
                        id="link_proyek"
                        name="link_proyek"
                        placeholder="https://contoh.com"
                    >
                </div>

                    <label for="teknologi">Teknologi yang Digunakan</label>

                    <input
                        type="text"
                        id="teknologi"
                        name="teknologi"
                        placeholder="Contoh: Python, Flask, HTML, CSS"
                        required
                    >

                </div>


                <div class="project-form-actions">

                    <a href="/admin" class="btn btn-cancel">
                        Kembali
                    </a>

                    <button type="submit" class="btn">
                        Simpan Proyek
                    </button>

                </div>

            </form>

        </div>

    </main>


    <footer>
        <p>© 2026 Portfolio Humairoh | Informatika</p>
    </footer>

</body>
</html>
